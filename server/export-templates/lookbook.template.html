<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}} - Lookbook</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=DM+Mono:ital,wght@0,300;0,400;1,300&family=DM+Sans:wght@300;400;500&display=swap');

    :root {
      --color-void: #070708;
      --color-surface: #0f0f11;
      --color-surface-raised: #161618;
      --color-border: #242428;
      --color-text: #f2f0eb;
      --color-text-muted: #8a8880;
      --color-text-faint: #4a4845;
      --color-gold: #e8c547;
      --color-gold-dim: #a88a2a;
      
      --font-display: 'Playfair Display', Georgia, serif;
      --font-mono: 'DM Mono', monospace;
      --font-sans: 'DM Sans', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--color-void);
      color: var(--color-text);
      font-family: var(--font-sans);
      line-height: 1.6;
      padding-bottom: 80px;
    }

    /* Film Grain Overlay */
    .film-grain {
      position: fixed;
      inset: 0;
      background-image: radial-gradient(rgba(255,255,255,0.015) 1px, transparent 0);
      background-size: 4px 4px;
      pointer-events: none;
      z-index: 9999;
      opacity: 0.8;
    }

    /* Header Nav */
    header {
      border-bottom: 1px solid var(--color-border);
      background-color: rgba(15, 15, 17, 0.9);
      backdrop-filter: blur(8px);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 15px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1.2rem;
      letter-spacing: 0.15em;
      color: var(--color-gold);
      text-decoration: none;
    }

    nav a {
      color: var(--color-text-muted);
      text-decoration: none;
      margin-left: 24px;
      font-size: 0.9rem;
      transition: color 0.2s;
    }

    nav a:hover {
      color: var(--color-gold);
    }

    /* Layout Sections */
    section {
      max-width: 900px;
      margin: 80px auto 0 auto;
      padding: 0 24px;
    }

    .hidden {
      display: none !important;
    }

    /* 1. Title Page */
    .title-page {
      text-align: center;
      padding: 120px 24px;
      border-bottom: 1px solid var(--color-border);
    }

    .title-page h1 {
      font-family: var(--font-display);
      font-size: 3.5rem;
      color: var(--color-text);
      margin-bottom: 16px;
      letter-spacing: -0.02em;
    }

    .format-badge {
      display: inline-block;
      padding: 4px 12px;
      border: 1px solid var(--color-border);
      background-color: var(--color-surface-raised);
      color: var(--color-gold);
      border-radius: 4px;
      font-size: 0.8rem;
      font-family: var(--font-mono);
      text-transform: uppercase;
      margin-bottom: 24px;
    }

    .logline {
      font-family: var(--font-display);
      font-style: italic;
      font-size: 1.3rem;
      color: var(--color-text-muted);
      max-width: 600px;
      margin: 0 auto 40px auto;
      line-height: 1.5;
    }

    .metadata-credits {
      font-family: var(--font-mono);
      font-size: 0.9rem;
      color: var(--color-text-muted);
    }

    .metadata-credits span {
      display: block;
      margin-top: 8px;
    }

    /* 2. Story / Treatment */
    .story-content {
      background-color: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 12px;
      padding: 40px;
    }

    .story-content h2, .screenplay h2, .flipbook-section h2, .gallery h2 {
      font-family: var(--font-display);
      font-size: 2rem;
      color: var(--color-gold);
      margin-bottom: 24px;
      border-bottom: 1px solid var(--color-border);
      padding-bottom: 12px;
    }

    .story-body {
      font-family: var(--font-sans);
      font-size: 1.1rem;
      line-height: 1.7;
    }

    .story-body p {
      margin-bottom: 20px;
    }

    .story-body h1 {
      font-family: var(--font-display);
      font-size: 1.6rem;
      margin: 32px 0 16px 0;
      color: var(--color-text);
    }

    .story-body h2 {
      font-family: var(--font-display);
      font-size: 1.3rem;
      margin: 24px 0 12px 0;
      color: var(--color-text-muted);
      border: none;
      padding: 0;
    }

    .story-body blockquote {
      border-left: 3px solid var(--color-gold);
      padding-left: 20px;
      margin: 24px 0;
      font-style: italic;
      color: var(--color-text-muted);
    }

    /* 3. Flipbook */
    .flipbook-container {
      position: relative;
      width: 100%;
      max-width: 480px;
      height: 580px;
      margin: 40px auto;
      perspective: 1200px;
    }

    .flipbook-nav {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 24px;
      margin-top: 24px;
    }

    .flipbook-btn {
      background: var(--color-surface-raised);
      border: 1px solid var(--color-border);
      color: var(--color-text);
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-family: var(--font-mono);
      font-size: 0.9rem;
      transition: all 0.2s;
    }

    .flipbook-btn:hover:not(:disabled) {
      border-color: var(--color-gold);
      color: var(--color-gold);
    }

    .flipbook-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .flipbook-indicator {
      font-family: var(--font-mono);
      font-size: 0.9rem;
      color: var(--color-text-muted);
    }

    /* 3D Scene Card */
    .lookbook-card {
      position: absolute;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.4s;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      z-index: 0;
    }

    .lookbook-card.active {
      opacity: 1;
      pointer-events: auto;
      z-index: 10;
    }

    .lookbook-card.flipped {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 16px;
      border: 1px solid var(--color-border);
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      background-color: var(--color-surface-raised);
      padding: 30px;
      display: flex;
      flex-col: column;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }

    .card-face.back {
      transform: rotateY(180deg);
      background-color: var(--color-surface);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--color-text-muted);
    }

    .card-header span {
      text-transform: uppercase;
    }

    .card-title {
      font-family: var(--font-display);
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--color-text);
      margin-bottom: 8px;
    }

    .card-meta {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      color: var(--color-gold);
      margin-bottom: 16px;
    }

    .card-img-placeholder {
      flex: 1;
      width: 100%;
      background-color: rgba(0,0,0,0.2);
      border: 1px solid var(--color-border);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--color-text-faint);
      font-size: 0.9rem;
      font-style: italic;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .card-img-placeholder img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-cast {
      font-size: 0.85rem;
      color: var(--color-text-muted);
      border-top: 1px solid var(--color-border);
      padding-top: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .cast-chip {
      background-color: rgba(255,255,255,0.03);
      border: 1px solid var(--color-border);
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-family: var(--font-mono);
    }

    /* Back Face detail */
    .card-synopsis {
      font-size: 0.95rem;
      color: var(--color-text);
      overflow-y: auto;
      flex: 1;
      margin-bottom: 16px;
      padding-right: 4px;
    }

    .card-notes {
      font-size: 0.85rem;
      font-style: italic;
      color: var(--color-text-muted);
      border-top: 1px solid var(--color-border);
      padding-top: 12px;
      margin-bottom: 12px;
    }

    .card-footer-metrics {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--color-text-muted);
    }

    .conflict-dots {
      display: flex;
      gap: 4px;
    }

    .conflict-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--color-border);
    }

    .conflict-dot.filled {
      background-color: var(--color-red);
    }

    /* 4. Screenplay */
    .screenplay-container {
      background-color: #ffffff;
      color: #000000;
      padding: 60px 80px;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      font-family: 'Courier New', Courier, monospace;
      font-size: 12pt;
      line-height: 1.2;
      max-width: 800px;
      margin: 40px auto 0 auto;
    }

    .screenplay-element {
      margin-bottom: 1.2em;
      white-space: pre-wrap;
    }

    /* Standard Screenplay Spacing rules */
    .sp-scene-heading {
      font-weight: bold;
      text-transform: uppercase;
      margin-top: 2em;
      margin-bottom: 1em;
    }

    .sp-action {
      margin-bottom: 1.2em;
    }

    .sp-character {
      text-align: center;
      text-transform: uppercase;
      margin-left: auto;
      margin-right: auto;
      width: fit-content;
      max-width: 40%;
      margin-bottom: 0.2em;
      margin-top: 1em;
    }

    .sp-dialogue {
      margin-left: 20%;
      margin-right: 20%;
      margin-bottom: 1.2em;
    }

    .sp-parenthetical {
      margin-left: 28%;
      margin-right: 28%;
      margin-bottom: 0.2em;
      text-indent: -0.5em;
    }

    .sp-transition {
      text-align: right;
      text-transform: uppercase;
      margin-left: 50%;
      margin-bottom: 1.2em;
      margin-top: 1.5em;
    }

    .sp-shot {
      font-weight: bold;
      text-transform: uppercase;
      margin-top: 1.5em;
    }

    .sp-titlepage {
      text-align: center;
      padding-top: 200px;
      padding-bottom: 200px;
      font-family: 'Courier New', Courier, monospace;
      line-height: 1.5;
    }

    .sp-titlepage-title {
      font-size: 24pt;
      font-weight: bold;
      margin-bottom: 1.5em;
      text-transform: uppercase;
    }

    .sp-note {
      background-color: #f3f3f3;
      border-left: 3px solid var(--color-gold);
      padding: 8px 12px;
      font-size: 11pt;
      color: #555555;
    }

    /* 5. Gallery */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 24px;
      margin-top: 32px;
    }

    .gallery-item {
      background-color: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: border-color 0.2s;
    }

    .gallery-item:hover {
      border-color: var(--color-gold);
    }

    .gallery-image-wrapper {
      width: 100%;
      height: 180px;
      background-color: rgba(0,0,0,0.2);
      overflow: hidden;
    }

    .gallery-image-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .gallery-meta {
      padding: 16px;
      font-size: 0.9rem;
    }

    .gallery-title {
      font-weight: 500;
      color: var(--color-text);
      margin-bottom: 4px;
    }

    .gallery-desc {
      color: var(--color-text-muted);
      font-size: 0.8rem;
    }

    /* Print styling overrides */
    @media print {
      body {
        background: white;
        color: black;
        padding-bottom: 0;
      }
      header, .brand, nav, .flipbook-nav, .lookbook-card:not(.active) {
        display: none !important;
      }
      .lookbook-card.active {
        position: relative;
        height: auto;
        opacity: 1;
        transform: none !important;
        box-shadow: none;
      }
      .card-face {
        position: relative;
        height: auto;
        border: none;
        background: transparent;
        box-shadow: none;
        page-break-after: always;
      }
      .card-face.back {
        display: block;
        transform: none !important;
      }
      .screenplay-container {
        box-shadow: none;
        padding: 0;
        margin: 0;
      }
      section {
        max-width: 100%;
        margin: 0;
        padding: 0;
        page-break-after: always;
      }
    }
  </style>
</head>
<body>
  <div class="film-grain"></div>

  <header>
    <a href="#" class="brand">FRAME</a>
    <nav>
      <a href="#story" class="{{STORY_CLASS}}">Story</a>
      <a href="#flipbook" class="{{FLIPBOOK_CLASS}}">Scenes</a>
      <a href="#screenplay" class="{{SCREENPLAY_CLASS}}">Screenplay</a>
      <a href="#gallery" class="{{GALLERY_CLASS}}">Gallery</a>
    </nav>
  </header>

  <!-- 1. Title Page Section -->
  <section class="title-page">
    <span class="format-badge">{{FORMAT}}</span>
    <h1>{{TITLE}}</h1>
    <p class="logline">“{{LOGLINE}}”</p>
    <div class="metadata-credits">
      <span>Written by</span>
      <strong style="color: var(--color-gold);">{{AUTHOR}}</strong>
      <span>{{CONTACT}}</span>
    </div>
  </section>

  <!-- 2. Story / Treatment Section -->
  <section id="story" class="story-section {{STORY_CLASS}}">
    <div class="story-content">
      <h2>Story & Treatment</h2>
      <div class="story-body">
        {{STORY_CONTENT}}
      </div>
    </div>
  </section>

  <!-- 3. Flipbook Section -->
  <section id="flipbook" class="flipbook-section {{FLIPBOOK_CLASS}}">
    <h2>Scene Flipbook</h2>
    <div class="flipbook-container" id="flipbookContainer">
      {{FLIPBOOK_CARDS}}
    </div>
    <div class="flipbook-nav">
      <button class="flipbook-btn" id="prevBtn" onclick="prevCard()">&lt; PREV</button>
      <span class="flipbook-indicator" id="cardIndicator">Scene 1 / 1</span>
      <button class="flipbook-btn" id="nextBtn" onclick="nextCard()">NEXT &gt;</button>
    </div>
  </section>

  <!-- 4. Screenplay Section -->
  <section id="screenplay" class="{{SCREENPLAY_CLASS}}">
    <h2>Screenplay</h2>
    <div class="screenplay-container">
      {{SCREENPLAY_CONTENT}}
    </div>
  </section>

  <!-- 5. Gallery Section -->
  <section id="gallery" class="{{GALLERY_CLASS}}">
    <h2>Sketches & Reference Gallery</h2>
    <div class="gallery-grid">
      {{GALLERY_CONTENT}}
    </div>
  </section>

  <script>
    // Flipbook navigation logic
    let currentIndex = 0;
    const cards = document.querySelectorAll('.lookbook-card');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const indicator = document.getElementById('cardIndicator');

    function updateFlipbook() {
      if (cards.length === 0) return;
      cards.forEach((card, idx) => {
        card.classList.remove('active');
        card.classList.remove('flipped');
        if (idx === currentIndex) {
          card.classList.add('active');
        }
      });
      indicator.textContent = `Scene ${currentIndex + 1} / ${cards.length}`;
      prevBtn.disabled = currentIndex === 0;
      nextBtn.disabled = currentIndex === cards.length - 1;
    }

    function prevCard() {
      if (currentIndex > 0) {
        currentIndex--;
        updateFlipbook();
      }
    }

    function nextCard() {
      if (currentIndex < cards.length - 1) {
        currentIndex++;
        updateFlipbook();
      }
    }

    // Flip card click handler
    cards.forEach(card => {
      card.addEventListener('click', (e) => {
        // Prevent flipping if text is selected or links clicked
        if (window.getSelection().toString()) return;
        card.classList.toggle('flipped');
      });
    });

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      updateFlipbook();
    });
  </script>
</body>
</html>
